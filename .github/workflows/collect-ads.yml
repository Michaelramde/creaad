name: Collecte (annonces + produits)

# Deux collectes indépendantes, toutes deux gratuites :
#  - Meta Ad Library via meta-ads-collector (open source, sans clé API)
#  - AliExpress via aliexpress-product-scraper (open source, sans clé API)
#
# Coût : 0 € (minutes gratuites GitHub ; illimité sur dépôt public).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien écrire en base (1/0)"
        required: false
        default: "1"
      skip_aliexpress:
        description: "Ne pas lancer la collecte AliExpress (1/0)"
        required: false
        default: "0"
      skip_meta:
        description: "Ne pas lancer la collecte Meta (1/0)"
        required: false
        default: "0"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  meta-ads:
    name: Annonces Meta
    if: ${{ inputs.skip_meta != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: |
          npm ci --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install --upgrade meta-ads-collector

      - name: Rechercher les annonces
        run: |
          mkdir -p .tmp
          # Un seul archétype par exécution : Meta limite fortement les
          # requêtes répétées depuis une même IP (constaté en production).
          python scripts/collector/meta_search.py \
            --seeds scripts/collector/seeds.json \
            --out .tmp/ads.jsonl \
            --max 10 \
            --rotate

      - name: Écrire dans Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "0" ]; then
            node scripts/collector/normalize.mjs .tmp/ads.jsonl
          else
            node scripts/collector/normalize.mjs .tmp/ads.jsonl --dry-run
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ads-jsonl
          path: .tmp/ads.jsonl
          if-no-files-found: ignore
          retention-days: 7

  aliexpress:
    name: Produits AliExpress
    if: ${{ inputs.skip_aliexpress != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Enrichir les produits
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # HTTP simple : la page produit expose og:title / og:image, alors
          # qu'un navigateur s'y fait bloquer. Pas de Chrome, pas de Puppeteer.
          if [ "${{ inputs.dry_run }}" = "0" ]; then
            node scripts/collector/aliexpress_enrich.mjs --file=scripts/collector/products.txt
          else
            node scripts/collector/aliexpress_enrich.mjs --file=scripts/collector/products.txt --dry-run
          fi
