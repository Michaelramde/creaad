name: Collecte (annonces + produits)

# Deux collectes indépendantes, toutes deux gratuites :
#  - Meta Ad Library via meta-ads-collector (open source, sans clé API)
#  - AliExpress via aliexpress-product-scraper (open source, sans clé API)
#
# Coût : 0 € (minutes gratuites GitHub ; illimité sur dépôt public).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien écrire en base (1/0)"
        required: false
        default: "1"
      skip_aliexpress:
        description: "Ne pas lancer la collecte AliExpress (1/0)"
        required: false
        default: "0"
      skip_meta:
        description: "Ne pas lancer la collecte Meta (1/0)"
        required: false
        default: "0"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  meta-ads:
    name: Annonces Meta
    if: ${{ inputs.skip_meta != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Rechercher les annonces
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p .tmp
          # Voie retenue : acteur Apify (proxies résidentiels, sans compte Facebook).
          # Notre propre navigateur reçoit une page _fb_noscript — abandonné.
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::notice::APIFY_TOKEN absent — collecte Meta ignorée."
            exit 0
          fi
          node scripts/collector/meta_apify.mjs --out=.tmp/ads.jsonl --max=20 --rotate

      - name: Écrire dans Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "0" ]; then
            node scripts/collector/normalize.mjs .tmp/ads.jsonl
          else
            node scripts/collector/normalize.mjs .tmp/ads.jsonl --dry-run
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ads-jsonl
          path: .tmp/ads.jsonl
          if-no-files-found: ignore
          retention-days: 7

  aliexpress:
    name: Produits AliExpress
    if: ${{ inputs.skip_aliexpress != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Enrichir les produits
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # HTTP simple : la page produit expose og:title / og:image, alors
          # qu'un navigateur s'y fait bloquer. Pas de Chrome, pas de Puppeteer.
          if [ "${{ inputs.dry_run }}" = "0" ]; then
            node scripts/collector/aliexpress_enrich.mjs --file=scripts/collector/products.txt
          else
            node scripts/collector/aliexpress_enrich.mjs --file=scripts/collector/products.txt --dry-run
          fi

      # L'index visuel grandit à chaque passage : c'est lui qui permet de
      # retrouver « tout ce qui ressemble » à la photo d'un commerçant.
      - name: Indexer visuellement les produits
        if: ${{ inputs.dry_run == '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/index-products.mjs --per=2
